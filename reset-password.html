<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://kgkdkkqoebnpahvetwzk.supabase.co; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Reset password — AI Learning Path</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light dark; --bg:#f4f5f7; --surface:#fff; --text:#252b30; --muted:#606b74; --border:#d4d9de; --brand:#3e8126; --error:#b42318; }
    @media (prefers-color-scheme:dark) { :root { --bg:#14171c; --surface:#1e232b; --text:#f3f5f7; --muted:#b4bdc8; --border:#424b58; --brand:#78b956; --error:#ffb4aa; } }
    body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.55; padding:32px 20px; }
    header, main { width:min(100%,440px); margin-inline:auto; }
    header a { color:var(--text); text-decoration:none; font-weight:750; }
    .dot { display:inline-block; width:12px; height:12px; margin-right:9px; border-radius:50%; background:var(--brand); }
    main { margin-top:52px; padding:28px; border:1px solid var(--border); border-radius:20px; background:var(--surface); }
    h1 { font-size:28px; letter-spacing:-.7px; line-height:1.2; margin:0 0 14px; }
    p { margin:0 0 24px; color:var(--muted); }
    label { display:block; font-size:14px; font-weight:650; margin-bottom:8px; }
    input { width:100%; min-height:48px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; font-size:16px; padding:12px; margin-bottom:20px; }
    button { width:100%; min-height:48px; border:0; border-radius:10px; background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    @media (prefers-color-scheme:dark) { button { color:#102008; } }
    button:disabled { opacity:.6; cursor:wait; }
    :focus-visible { outline:3px solid var(--brand); outline-offset:3px; }
    #feedback { margin-top:20px; margin-bottom:0; }
    #feedback[data-kind="error"] { color:var(--error); }
    .back { display:block; margin-top:24px; text-align:center; color:var(--text); }
    [hidden] { display:none !important; }
    @media (max-width:380px) { main { padding:22px; margin-top:32px; } }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
  <script defer src="reset-password.js"></script>
</head>
<body>
  <header><a href="index.html"><span class="dot" aria-hidden="true"></span>AI Learning Path</a></header>
  <main aria-labelledby="resetTitle">
    <h1 id="resetTitle">Choose a new password</h1>
    <p id="resetDescription" role="status">Checking your reset link…</p>
    <form id="passwordForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required aria-describedby="resetDescription">
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
      <button id="savePassword" type="submit">Save new password</button>
    </form>
    <form id="requestForm" hidden>
      <label for="resetEmail">Account email</label>
      <input id="resetEmail" type="email" autocomplete="email" required>
      <button id="sendReset" type="submit">Send a new reset link</button>
    </form>
    <p id="feedback" role="status" aria-live="polite" hidden></p>
    <a class="back" href="index.html" id="returnLink">Back to the app</a>
    <noscript>Enable JavaScript to reset your password.</noscript>
  </main>
</body>
</html>
