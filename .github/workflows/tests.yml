name: tests

# There is no build step for this app (app.js ships as-is, no bundler), so CI
# is exactly the two commands documented in the README and in tools/README.md:
# `node tests/<file>` for each JS suite, and pytest for the Python tools. The
# only thing this workflow adds over running them by hand is doing it on
# every push/PR, and installing the full tools/requirements.txt so the
# PyMuPDF/reportlab end-to-end tests actually run instead of skipping.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: app.js suites (lift-and-compile from the shipping source)
        run: |
          set -e
          for f in tests/lesson-flow.js tests/onboarding.js tests/pdf-pipeline.js \
                   tests/lesson-visuals.js tests/learning-state.js; do
            echo "== $f =="
            node "$f"
          done
      - name: ai-proxy policy suite
        run: node tests/ai-proxy-policy.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tesseract + its Hebrew pack + a DejaVu font are what let
      # ScannedDocumentTests run instead of skipping (see tests/test_pdf_prep.py).
      - name: System packages for OCR tests
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-heb fonts-dejavu-core
      - name: Install tools/requirements.txt (+ pytest)
        run: |
          pip install -r tools/requirements.txt
          pip install pytest
      - name: pdf_prep / pdf_index suites
        run: pytest tests/test_pdf_prep.py tests/test_pdf_index.py -v

  # RLS policies had zero automated coverage before this file, despite
  # having already shipped one real grant-leak bug (see the header comment
  # in the test itself). This runs against a plain local Postgres + pgTAP —
  # not the full Supabase CLI/Docker stack, since this repo's migrations
  # never CREATE the base tables (only ALTER them), so `supabase db reset`
  # can't rebuild the schema from this repo alone. The test builds its own
  # fixture tables instead; see supabase/tests/database/rls_policies.test.sql.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-16-pgtap
          sudo systemctl start postgresql
      - name: RLS policy suite
        run: |
          sudo -u postgres createdb rls_test
          sudo -u postgres psql -d rls_test -c 'create extension pgtap;'
          sudo -u postgres pg_prove -d rls_test supabase/tests/database/rls_policies.test.sql
