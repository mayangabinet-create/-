<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Learning Path">
  <!-- The app's own character: the plain green dot, same radial gradient as
       the .dot rule in index.html (--dot-light 0%, --dot 55%, --dot-deep 100%,
       lit from 32%/26%). A tab favicon is 16px on most screens, so this is the
       dot and nothing else — a glyph or wordmark at that size is mud.
       Light-mode brand colours are used unconditionally: an SVG favicon can
       carry a prefers-color-scheme media query, but browsers rasterise it
       against the *browser chrome's* theme, not the page's, and the dark-mode
       green (#7ED957) disappears into a light tab strip. -->
  <defs>
    <radialGradient id="d" cx="32%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#6FBF47"/>
      <stop offset="55%" stop-color="#3E8523"/>
      <stop offset="100%" stop-color="#2F6B18"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#d)"/>
</svg>
