<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Learning Path">
  <!-- The app's own character: the plain green dot. Flat fill, matching the
       .dot rule in index.html — one solid colour, no gradient, no highlight.
       A tab favicon is 16px on most screens, so this is the dot and nothing
       else; a glyph or wordmark at that size is mud.
       Light-mode brand green unconditionally: an SVG favicon can carry a
       prefers-color-scheme query, but browsers rasterise it against the
       *browser chrome's* theme, not the page's, and the dark-mode green
       (#7ED957) disappears into a light tab strip. -->
  <circle cx="32" cy="32" r="26" fill="#3E8523"/>
</svg>
